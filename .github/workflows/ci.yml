name: TokenLedger CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild static site & verify clean diff
        run: node scripts/build-site.js
      - name: Verify pricing engine parity & unit math
        run: |
          node -e "const E=require('./js/pricing-engine.js'); const j=require('./api/pricing.json'); if(E.MODELS.length<44||E.MODELS.length!==j.models.length) process.exit(1); console.log('CI OK:', E.MODELS.length, 'models');"
